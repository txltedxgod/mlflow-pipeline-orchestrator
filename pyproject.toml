[project]
name = "mlflow-pipeline-orchestrator"
version = "0.1.0"
dependencies = [
    "pydantic>=2.5.0",
    "numpy>=1.24.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
